name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t paper-build .
      - name: Build both pipelines and the citation diff
        run: docker run --rm -u "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD":/work paper-build make all test
      - name: Show citation diff
        run: cat build/compare/citations.diff || true
      - uses: actions/upload-artifact@v4
        with:
          name: sample-outputs
          path: |
            build/zotero/paper.docx
            build/zotero/paper.pdf
            build/jurism/paper.docx
            build/jurism/paper.pdf
            build/jurism/citations.json
            build/compare/
          if-no-files-found: error
